<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 - No Audio</title>
    <style>
        :root {
            --bg-color: #faf8ef;
            --grid-color: #bbada0;
            --empty-cell-color: #cdc1b4;
            --text-dark: #776e65;
            --text-light: #f9f6f2;
        }

        body {
            font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: none; /* Prevent scrolling on mobile while playing */
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 48px;
            margin: 0;
            font-weight: 700;
        }

        .score-container {
            background: #bbada0;
            padding: 10px 20px;
            border-radius: 6px;
            color: white;
            text-align: center;
            min-width: 80px;
        }

        .score-label {
            font-size: 12px;
            text-transform: uppercase;
            display: block;
        }

        .score-value {
            font-size: 24px;
            font-weight: bold;
        }

        .game-intro {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button.restart-btn {
            background: #8f7a66;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 3px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        button.restart-btn:hover {
            background: #7f6a56;
        }

        .game-board {
            position: relative;
            background: var(--grid-color);
            border-radius: 6px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            aspect-ratio: 1 / 1;
        }

        .cell {
            background: var(--empty-cell-color);
            border-radius: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
            color: var(--text-dark);
            transition: all 0.1s ease-in-out;
        }

        /* Tile Colors */
        .tile-2 { background: #eee4da; }
        .tile-4 { background: #ede0c8; }
        .tile-8 { background: #f2b179; color: var(--text-light); }
        .tile-16 { background: #f59563; color: var(--text-light); }
        .tile-32 { background: #f67c5f; color: var(--text-light); }
        .tile-64 { background: #f65e3b; color: var(--text-light); }
        .tile-128 { background: #edcf72; color: var(--text-light); font-size: 32px; }
        .tile-256 { background: #edcc61; color: var(--text-light); font-size: 32px; }
        .tile-512 { background: #edc850; color: var(--text-light); font-size: 32px; }
        .tile-1024 { background: #edc53f; color: var(--text-light); font-size: 24px; }
        .tile-2048 { background: #edc22e; color: var(--text-light); font-size: 24px; }
        .tile-super { background: #3c3a32; color: var(--text-light); font-size: 20px; }

        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(238, 228, 218, 0.73);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .game-over-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .game-over-text {
            font-size: 40px;
            font-weight: bold;
            color: #776e65;
            margin-bottom: 20px;
        }

        /* Leaderboard Styles */
        .leaderboard-section {
            margin-top: 30px;
            background: white;
            padding: 15px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .leaderboard-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid #eee;
        }

        th {
            color: #888;
            font-size: 14px;
        }

        @media (max-width: 520px) {
            .cell { font-size: 28px; }
            .tile-128, .tile-256, .tile-512 { font-size: 22px; }
            .tile-1024, .tile-2048 { font-size: 18px; }
            h1 { font-size: 32px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>2048</h1>
        <div class="score-container">
            <span class="score-label">Score</span>
            <span class="score-value" id="current-score">0</span>
        </div>
    </header>

    <div class="game-intro">
        <p>Join the numbers to get <strong>2048!</strong></p>
        <button class="restart-btn" onclick="game.restart()">New Game</button>
    </div>

    <div class="game-board" id="grid">
        <!-- Grid cells generated by JS -->
        <div class="game-over-overlay" id="game-over">
            <div class="game-over-text">Game Over!</div>
            <button class="restart-btn" onclick="game.restart()">Try Again</button>
        </div>
    </div>

    <div class="leaderboard-section">
        <div class="leaderboard-title">Top Scores</div>
        <table id="leaderboard-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Date</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows generated by JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
class Game2048 {
    constructor() {
        this.gridElement = document.getElementById('grid');
        this.scoreElement = document.getElementById('current-score');
        this.gameOverOverlay = document.getElementById('game-over');
        this.leaderboardTableBody = document.querySelector('#leaderboard-table tbody');
        
        this.size = 4;
        this.grid = [];
        this.score = 0;
        this.touchStartX = 0;
        this.touchStartY = 0;
        
        this.init();
        this.setupInput();
        this.loadLeaderboard();
    }

    init() {
        // Create grid DOM elements
        this.gridElement.innerHTML = '';
        this.gridElement.appendChild(this.gameOverOverlay);
        
        for (let i = 0; i < this.size * this.size; i++) {
            let cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.index = i;
            this.gridElement.appendChild(cell);
        }
        
        this.restart();
    }

    restart() {
        this.grid = Array(this.size * this.size).fill(0);
        this.score = 0;
        this.updateScore();
        this.gameOverOverlay.classList.remove('active');
        
        this.addRandomTile();
        this.addRandomTile();
        this.render();
    }

    addRandomTile() {
        let emptyCells = [];
        for (let i = 0; i < this.grid.length; i++) {
            if (this.grid[i] === 0) emptyCells.push(i);
        }
        
        if (emptyCells.length > 0) {
            let randomIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            this.grid[randomIndex] = Math.random() < 0.9 ? 2 : 4;
        }
    }

    render() {
        const cells = document.querySelectorAll('.cell');
        for (let i = 0; i < this.grid.length; i++) {
            let value = this.grid[i];
            let cell = cells[i];
            
            cell.textContent = value === 0 ? '' : value;
            cell.className = 'cell'; // Reset classes
            
            if (value > 0) {
                if (value <= 2048) {
                    cell.classList.add(`tile-${value}`);
                } else {
                    cell.classList.add('tile-super');
                }
            }
        }
    }

    updateScore() {
        this.scoreElement.textContent = this.score;
    }

    // Movement Logic
    move(direction) {
        let moved = false;
        let newGrid = [...this.grid];

        if (direction === 'up' || direction === 'down') {
            for (let col = 0; col < this.size; col++) {
                let column = [];
                for (let row = 0; row < this.size; row++) {
                    column.push(newGrid[row * this.size + col]);
                }
                if (direction === 'down') column.reverse();
                
                let processed = this.processLine(column);
                let result = direction === 'down' ? processed.line.reverse() : processed.line;
                
                for (let row = 0; row < this.size; row++) {
                    let index = row * this.size + col;
                    if (newGrid[index] !== result[row]) moved = true;
                    newGrid[index] = result[row];
                }
            }
        } else { // left or right
            for (let row = 0; row < this.size; row++) {
                let line = [];
                for (let col = 0; col < this.size; col++) {
                    line.push(newGrid[row * this.size + col]);
                }
                if (direction === 'right') line.reverse();
                
                let processed = this.processLine(line);
                let result = direction === 'right' ? processed.line.reverse() : processed.line;
                
                for (let col = 0; col < this.size; col++) {
                    let index = row * this.size + col;
                    if (newGrid[index] !== result[col]) moved = true;
                    newGrid[index] = result[col];
                }
            }
        }

        if (moved) {
            this.grid = newGrid;
            this.addRandomTile();
            this.render();
            this.checkGameOver();
        }
    }

    processLine(line) {
        // Remove zeros
        let filtered = line.filter(val => val !== 0);
        let scoreAdd = 0;

        // Merge
        for (let i = 0; i < filtered.length - 1; i++) {
            if (filtered[i] === filtered[i+1]) {
                filtered[i] *= 2;
                scoreAdd += filtered[i];
                filtered.splice(i + 1, 1);
            }
        }

        // Pad with zeros
        while (filtered.length < this.size) {
            filtered.push(0);
        }

        return { line: filtered, score: scoreAdd };
    }

    checkGameOver() {
        // Check for empty cells
        if (this.grid.includes(0)) return;

        // Check for possible merges
        for (let i = 0; i < this.size; i++) {
            for (let j = 0; j < this.size; j++) {
                let current = this.grid[i * this.size + j];
                // Check right
                if (j < this.size - 1 && current === this.grid[i * this.size + j + 1]) return;
                // Check down
                if (i < this.size - 1 && current === this.grid[(i + 1) * this.size + j]) return;
            }
        }

        // If we are here, game over
        this.gameOverOverlay.classList.add('active');
        this.saveScore();
    }

    saveScore() {
        let scores = JSON.parse(localStorage.getItem('2048_scores') || '[]');
        let date = new Date().toLocaleDateString();
        scores.push({ score: this.score, date: date });
        scores.sort((a, b) => b.score - a.score);
        scores = scores.slice(0, 5); // Keep top 5
        localStorage.setItem('2048_scores', JSON.stringify(scores));
        this.loadLeaderboard();
    }

    loadLeaderboard() {
        let scores = JSON.parse(localStorage.getItem('2048_scores') || '[]');
        this.leaderboardTableBody.innerHTML = '';
        
        if (scores.length === 0) {
            this.leaderboardTableBody.innerHTML = '<tr><td colspan="3">No games yet</td></tr>';
            return;
        }

        scores.forEach((entry, index) => {
            let row = document.createElement('tr');
            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${entry.date}</td>
                <td>${entry.score}</td>
            `;
            this.leaderboardTableBody.appendChild(row);
        });
    }

    setupInput() {
        // Keyboard
        document.addEventListener('keydown', (e) => {
            if (this.gameOverOverlay.classList.contains('active')) return;
            
            switch(e.key) {
                case 'ArrowUp': this.move('up'); break;
                case 'ArrowDown': this.move('down'); break;
                case 'ArrowLeft': this.move('left'); break;
                case 'ArrowRight': this.move('right'); break;
            }
        });

        // Touch
        this.gridElement.addEventListener('touchstart', (e) => {
            this.touchStartX = e.touches[0].clientX;
            this.touchStartY = e.touches[0].clientY;
        }, { passive: false });

        this.gridElement.addEventListener('touchend', (e) => {
            if (this.gameOverOverlay.classList.contains('active')) return;
            
            let touchEndX = e.changedTouches[0].clientX;
            let touchEndY = e.changedTouches[0].clientY;
            
            let dx = touchEndX - this.touchStartX;
            let dy = touchEndY - this.touchStartY;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                // Horizontal
                if (Math.abs(dx) > 30) { // Threshold
                    if (dx > 0) this.move('right');
                    else this.move('left');
                }
            } else {
                // Vertical
                if (Math.abs(dy) > 30) {
                    if (dy > 0) this.move('down');
                    else this.move('up');
                }
            }
            e.preventDefault();
        }, { passive: false });
    }
}

// Start the game
const game = new Game2048();
</script>

</body>
</html>
