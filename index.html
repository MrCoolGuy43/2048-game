<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 - Global Edition</title>
    <style>
        :root {
            --bg-color: #faf8ef;
            --grid-color: #bbada0;
            --empty-cell-color: #cdc1b4;
            --text-dark: #776e65;
            --text-light: #f9f6f2;
            
            /* Tile Colors */
            --tile-2: #eee4da;
            --tile-4: #ede0c8;
            --tile-8: #f2b179;
            --tile-16: #f59563;
            --tile-32: #f67c5f;
            --tile-64: #f65e3b;
            --tile-128: #edcf72;
            --tile-256: #edcc61;
            --tile-512: #edc850;
            --tile-1024: #edc53f;
            --tile-2048: #edc22e;
            --tile-super: #3c3a32;

            --gap: 10px;
            --cell-size: 80px;
            --anim-speed: 150ms;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: none; /* Prevent scrolling while swiping */
        }

        h1 {
            font-size: 40px;
            margin: 0;
            font-weight: 700;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: calc(var(--cell-size) * 4 + var(--gap) * 5);
            margin-bottom: 10px;
        }

        .score-container {
            background: var(--grid-color);
            padding: 5px 15px;
            border-radius: 5px;
            color: white;
            text-align: center;
            min-width: 80px;
        }

        .score-label { font-size: 12px; text-transform: uppercase; }
        .score-value { font-size: 20px; font-weight: bold; }

        button.new-game-btn {
            background: #8f7a66;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        button.new-game-btn:hover { background: #7f6a56; }

        /* Game Board */
        .game-container {
            position: relative;
            background: var(--grid-color);
            padding: var(--gap);
            border-radius: 6px;
            width: calc(var(--cell-size) * 4 + var(--gap) * 3);
            height: calc(var(--cell-size) * 4 + var(--gap) * 3);
            box-sizing: content-box;
        }

        .grid-background {
            display: grid;
            grid-template-columns: repeat(4, var(--cell-size));
            grid-template-rows: repeat(4, var(--cell-size));
            gap: var(--gap);
        }

        .grid-cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background: var(--empty-cell-color);
            border-radius: 3px;
        }

        .tile-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            padding: var(--gap);
            z-index: 10;
            pointer-events: none; /* Let clicks pass through */
        }

        .tile {
            position: absolute;
            width: var(--cell-size);
            height: var(--cell-size);
            border-radius: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 32px;
            transition: transform var(--anim-speed) ease-in-out;
            z-index: 10;
            animation: appear 200ms ease-in-out;
        }

        @keyframes appear {
            0% { opacity: 0; transform: scale(0); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Tile Styling */
        .tile-2 { background: var(--tile-2); color: var(--text-dark); }
        .tile-4 { background: var(--tile-4); color: var(--text-dark); }
        .tile-8 { background: var(--tile-8); color: var(--text-light); }
        .tile-16 { background: var(--tile-16); color: var(--text-light); }
        .tile-32 { background: var(--tile-32); color: var(--text-light); }
        .tile-64 { background: var(--tile-64); color: var(--text-light); }
        .tile-128 { background: var(--tile-128); color: var(--text-light); font-size: 28px; }
        .tile-256 { background: var(--tile-256); color: var(--text-light); font-size: 28px; }
        .tile-512 { background: var(--tile-512); color: var(--text-light); font-size: 28px; }
        .tile-1024 { background: var(--tile-1024); color: var(--text-light); font-size: 24px; }
        .tile-2048 { background: var(--tile-2048); color: var(--text-light); font-size: 24px; box-shadow: 0 0 10px gold; }
        .tile-super { background: var(--tile-super); color: var(--text-light); font-size: 20px; }

        /* Overlays */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(238, 228, 218, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-radius: 6px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay h2 {
            font-size: 40px;
            margin-bottom: 20px;
            color: var(--text-dark);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border: 2px solid var(--grid-color);
            border-radius: 4px;
            outline: none;
            text-align: center;
        }

        /* Leaderboard Modal */
        .leaderboard-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        
        .leaderboard-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            text-align: center;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        
        .leaderboard-table th, .leaderboard-table td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        
        .leaderboard-table th { background: #f0f0f0; }

        .close-btn {
            margin-top: 15px;
            background: #ccc;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        .loading { color: gray; font-style: italic; }

    </style>
</head>
<body>

    <div class="header-container">
        <div>
            <h1>2048</h1>
            <button onclick="showLeaderboard()" style="background:none; border:none; color:#8f7a66; text-decoration:underline; cursor:pointer;">View Global Leaderboard</button>
        </div>
        <div class="score-container">
            <div class="score-label">Score</div>
            <div class="score-value" id="score-display">0</div>
        </div>
        <button class="new-game-btn" onclick="startNewGame()">New Game</button>
    </div>

    <div class="game-container" id="game-container">
        <div class="grid-background">
            <!-- 16 Grid Cells -->
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        </div>
        
        <div class="tile-container" id="tile-container">
            <!-- Tiles injected here via JS -->
        </div>

        <!-- Game Over Overlay -->
        <div class="overlay" id="game-over-overlay">
            <h2>Game Over!</h2>
            <div class="input-group">
                <input type="text" id="player-name" placeholder="Enter your name" maxlength="15">
                <button class="new-game-btn" onclick="submitScoreAndRestart()">Save & Restart</button>
            </div>
        </div>
        
        <!-- Win Overlay (Optional, just shows continue) -->
        <div class="overlay" id="win-overlay">
            <h2>You Win!</h2>
            <button class="new-game-btn" onclick="continuePlaying()">Keep Going</button>
            <button class="new-game-btn" style="margin-top:10px; background:#ccc;" onclick="startNewGame()">New Game</button>
        </div>
    </div>

    <!-- Leaderboard Modal -->
    <div class="leaderboard-modal" id="lb-modal">
        <div class="leaderboard-content">
            <h2>Global Leaderboard</h2>
            <div id="lb-loading" class="loading">Loading scores...</div>
            <table class="leaderboard-table" id="lb-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody id="lb-body"></tbody>
            </table>
            <button class="close-btn" onclick="closeLeaderboard()">Close</button>
        </div>
    </div>

    function startNewGame() {
        board = Array(16).fill(0);
        score = 0;
        gameOver = false;
        won = false;
        continuing = false;
        
        updateScore(0);
        spawnTile();
        spawnTile();
        renderBoard();
        
        gameOverOverlay.classList.remove('active');
        winOverlay.classList.remove('active');
    }

    function spawnTile() {
        const emptyIndices = board.map((val, idx) => val === 0 ? idx : null).filter(val => val !== null);
        if (emptyIndices.length === 0) return;
        
        const randIndex = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
        board[randIndex] = Math.random() < 0.9 ? 2 : 4;
    }

    function updateScore(add) {
        score += add;
        scoreDisplay.innerText = score;
    }

    // --- RENDERING LOGIC (CSS TRANSFORMS) ---
    function renderBoard() {
        tileContainer.innerHTML = '';
        
        for (let i = 0; i < 16; i++) {
            if (board[i] !== 0) {
                const tile = document.createElement('div');
                tile.classList.add('tile', `tile-${board[i] > 2048 ? 'super' : board[i]}`);
                tile.innerText = board[i];
                
                // Calculate position
                const x = i % 4;
                const y = Math.floor(i / 4);
                const gap = 10;
                const size = 80;
                
                // CSS Transform logic
                const translateX = x * (size + gap);
                const translateY = y * (size + gap);
                
                tile.style.transform = `translate(${translateX}px, ${translateY}px)`;
                tileContainer.appendChild(tile);
            }
        }
    }

    // Refined Move Function
    function tryMove(direction) {
        let oldBoardStr = JSON.stringify(board);
        
        // Extract lines
        let rows = [[],[],[],[]];
        let cols = [[],[],[],[]];
        
        for(let r=0; r<4; r++) rows[r] = [board[r*4], board[r*4+1], board[r*4+2], board[r*4+3]];
        for(let c=0; c<4; c++) cols[c] = [board[c], board[c+4], board[c+8], board[c+12]];
        
        // Rotate to simplify processing (always process Left)

        // Let's stick to specific loops to avoid rotation bugs
        let moved = false;
        let gained = 0;
        
        if (direction === 'ArrowLeft') {
            for(let r=0; r<4; r++) {
                let line = getRow(r);
                let res = processLine(line);
                if(JSON.stringify(res.line) !== JSON.stringify(line)) moved = true;
                setRow(r, res.line);
                gained += res.score;
            }
        } else if (direction === 'ArrowRight') {
            for(let r=0; r<4; r++) {
                let line = getRow(r).reverse();
                let res = processLine(line);
                let finalLine = res.line.reverse();
                if(JSON.stringify(finalLine) !== JSON.stringify(getRow(r))) moved = true;
                setRow(r, finalLine);
                gained += res.score;
            }
        } else if (direction === 'ArrowUp') {
            for(let c=0; c<4; c++) {
                let line = getCol(c);
                let res = processLine(line);
                if(JSON.stringify(res.line) !== JSON.stringify(getCol(c))) moved = true;
                setCol(c, res.line);

            }
        } else if (direction === 'ArrowDown') {

                let res = processLine(line);
                let finalLine = res.line.reverse();
                if(JSON.stringify(finalLine) !== JSON.stringify(getCol(c))) moved = true;
                setCol(c, finalLine);
                gained += res.score;
            }
        }
        
        if (moved) {
            updateScore(gained);
            spawnTile();
            renderBoard();
            checkGameState();
        }
    }

    function checkGameState() {
        // Check Win
        if (!won && board.includes(2048)) {
            won = true;
            winOverlay.classList.add('active');
            return;
        }
        
        // Check Game Over
        if (isGameOver()) {
            gameOver = true;
            setTimeout(() => {
                gameOverOverlay.classList.add('active');
                nameInput.focus();
            }, 500);
        }
    }

    function isGameOver() {
        if (board.includes(0)) return false;
        for (let r = 0; r < 4; r++) {
            for (let c = 0; c < 4; c++) {
                let current = board[r*4 + c];
                let right = (c < 3) ? board[r*4 + c + 1] : null;
                let down = (r < 3) ? board[(r+1)*4 + c] : null;
                
                if ((right && right === current) || (down && down === current)) {
                    return false;
                }
            }
        }
        return true;
    }

    function continuePlaying() {
        winOverlay.classList.remove('active');
        continuing = true;
    }

    // --- INPUT HANDLING ---
    function setupInput() {
        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
                tryMove(e.key);
            }
        });
        
        // Touch support
        let touchStartX = 0;
        let touchStartY = 0;
        const gameArea = document.getElementById('game-container');
        
        gameArea.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: false});
        
        gameArea.addEventListener('touchend', (e) => {
            e.preventDefault();
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            
            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 30) tryMove(dx > 0 ? 'ArrowRight' : 'ArrowLeft');
            } else {
                if (Math.abs(dy) > 30) tryMove(dy > 0 ? 'ArrowDown' : 'ArrowUp');
            }
        }, {passive: false});
    }

    // --- LEADERBOARD LOGIC ---
    
    // Local Storage Helper
    function saveToLocal(name, score) {
        let history = JSON.parse(localStorage.getItem('2048_history')) || [];
        history.push({ name, score, date: new Date().toISOString() });
        localStorage.setItem('2048_history', JSON.stringify(history));
    }

    function submitScoreAndRestart() {
        const name = nameInput.value.trim() || "Anonymous";
        saveToLocal(name, score);
        
        // Push to Global DB
        pushToGlobalDB(name, score);
        
        startNewGame();
    }

        }
    }

    function renderLeaderboard(scores) {
        lbBody.innerHTML = '';
        if (scores.length === 0) {
            lbBody.innerHTML = '<tr><td colspan="3" style="text-align:center">No scores yet</td></tr>';
            return;
        }
        
        scores.forEach((entry, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${escapeHtml(entry.name)}</td>
                <td>${entry.score}</td>
            `;
            lbBody.appendChild(tr);
        });
        lbTable.style.display = 'table';
    }

    function showLeaderboard() {
        lbModal.style.display = 'flex';
        loadGlobalLeaderboard();
    }

    function closeLeaderboard() {
        lbModal.style.display = 'none';
    }

    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

</script>
</body>
</html>
